name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Format, clippy, test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false

      # Pinned to >= 2.9.2: 2.9.0/2.9.1 had a Windows cache-path validation bug.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Tag runs read main's cache but never write back: the tag-scoped
          # cache would never be reused and would only consume cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE."
          }

          $metadata = $metadataJson | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'timedivers-manager-rs' }) | Select-Object -First 1
          if (-not $package) {
            throw 'Package timedivers-manager-rs was not found in cargo metadata.'
          }

          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match package version '$expectedTag'."
          }

          Write-Host "Release tag '$env:RELEASE_TAG' matches package version $($package.version)."

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: timedivers-manager-rs-windows-x64
          path: target/release/timedivers-manager-rs.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Package and release (Windows)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: timedivers-manager-rs-windows-x64
          path: dist

      - name: Locate 7-Zip
        id: seven-zip
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            throw '7z was not found on the Windows runner.'
          }

          "path=$($sevenZip.Path)" >> $env:GITHUB_OUTPUT

      - name: Package release archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SEVEN_ZIP: ${{ steps.seven-zip.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\timedivers-manager-rs.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Build artifact not found: $exe"
          }

          $archiveName = "timedivers-manager-rs-$($env:RELEASE_TAG)-windows-x64.7z"
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\$archiveName"
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'dist')
          try {
            & $env:SEVEN_ZIP a -t7z '-m0=LZMA2:d=256m:fb=273' '-mx=9' '-ms=on' '-mmt=1' $archive 'timedivers-manager-rs.exe'
            if ($LASTEXITCODE -ne 0) {
              throw "7z archive creation failed with exit code $LASTEXITCODE."
            }

            & $env:SEVEN_ZIP t $archive
            if ($LASTEXITCODE -ne 0) {
              throw "7z archive verification failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          Write-Host "Created and verified $archiveName."

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/timedivers-manager-rs-${{ github.ref_name }}-windows-x64.7z
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
