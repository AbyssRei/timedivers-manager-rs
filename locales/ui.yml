dlg:
  confirm_delete_title:
    en: "Confirm Delete"
    zh-CN: "确认删除"
  confirm_delete:
    en: "Delete version '%{date}' [%{branch}]?\n\n%{path}"
    zh-CN: "删除版本 '%{date}' [%{branch}]？\n\n%{path}"
  setup_message:
    en: "This will:\n\n  • Rename '%{installdir}' to '%{installdir}_steam'\n  • Create a junction '%{installdir}' pointing to it\n\nThe game will continue to work normally. This only needs to be done once.\n\nProceed?"
    zh-CN: "此操作将：\n\n  • 把 '%{installdir}' 重命名为 '%{installdir}_steam'\n  • 创建指向它的目录联接 '%{installdir}'\n\n游戏仍可正常运行。此操作只需执行一次。\n\n是否继续？"
  setup_both_exist:
    en: "Both folders already exist:\n  %{active}\n  %{steam}\n\nPlease resolve manually and restart."
    zh-CN: "两个目录都已存在：\n  %{active}\n  %{steam}\n\n请手动处理后重新打开程序。"
  setup_game_missing:
    en: "Game folder not found:\n%{path}\n\nMake sure the game is installed."
    zh-CN: "未找到游戏目录：\n%{path}\n\n请确认游戏已安装。"
  manual_step:
    en: "Windows prevented the rename.\n\nPlease rename manually in File Explorer:\n  From: %{installdir}\n  To:   %{installdir}_steam\n\nLocation: %{common}\n\nThen run the folder setup again. The junction will be created."
    zh-CN: "Windows 拒绝了重命名操作。\n\n请在文件资源管理器中手动重命名：\n  从：%{installdir}\n  到：  %{installdir}_steam\n\n位置：%{common}\n\n然后再次执行目录初始化，程序会创建目录联接。"
  revert_message:
    en: "This will:\n\n  • Remove the junction\n  • Rename '%{installdir}_steam' back to '%{installdir}'\n\nDownloaded version folders will remain on disk.\n\nContinue?"
    zh-CN: "此操作将：\n\n  • 移除目录联接\n  • 把 '%{installdir}_steam' 重命名回 '%{installdir}'\n\n已下载的版本目录会保留在磁盘上。\n\n是否继续？"
  revert_no_steam:
    en: "Steam version folder not found:\n%{path}\n\nThe Steam version must be present to revert."
    zh-CN: "未找到 Steam 版本目录：\n%{path}\n\n还原前必须存在 Steam 版本。"
  revert_no_folder:
    en: "Steam folder not found:\n%{path}\n\nPlease rename manually:\n  From: %{installdir}_steam\n  To: %{installdir}"
    zh-CN: "未找到 Steam 目录：\n%{path}\n\n请手动重命名：\n  从：%{installdir}_steam\n  到：%{installdir}"

info:
  revert_complete:
    en: "Folder setup reverted.\n\nDownloaded version folders remain on disk and can be deleted manually."
    zh-CN: "目录设置已还原。\n\n已下载的版本目录仍保留在磁盘上，可手动删除。"

scraper:
  confirm_title:
    en: "Update List"
    zh-CN: "更新版本清单"
  confirm_message:
    en: "A Chromium-based browser will be used to scrape SteamDB.\n\nIt will be restarted in debug mode. Please ensure you are logged into your Steam account on SteamDB, then return here and select Continue.\n\nThe following %{count} depot ID(s) will be scraped for %{name}:\n%{depots}\n\nSome of these may be DLC depots. Consider uninstalling DLCs before scraping.\n\nContinue?"
    zh-CN: "将使用 Chromium 内核浏览器抓取 SteamDB。\n\n浏览器将以调试模式重启。请先确保你在 SteamDB 上登录了 Steam 账号，然后回到此处点击“继续”。\n\n即将为 %{name} 抓取以下 %{count} 个 depot ID：\n%{depots}\n\n其中可能包含 DLC depot，建议抓取前先卸载 DLC。\n\n是否继续？"
  continue:
    en: "Continue"
    zh-CN: "继续"
  update_complete:
    en: "Manifest list has been updated."
    zh-CN: "版本清单已更新。"
  no_browsers:
    en: "No supported browsers found on this system."
    zh-CN: "未在系统中找到受支持的浏览器。"
  select_browser_title:
    en: "Select Browser"
    zh-CN: "选择浏览器"
  select_browser:
    en: "Choose a browser to use for scraping:"
    zh-CN: "选择用于抓取的浏览器："
  select:
